<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>window.POT_STANDALONE=true</script>
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:#000000;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Progressive Overload Training</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --ink:#ffffff; --muted:#8e8e93; --line:#38383a; --chip:#3a3a3c; --bar:rgba(28,28,30,.88);
  --accent:#059669; --accent-ink:#ffffff; --accent-soft:rgba(5,150,105,.2); --warn:#e2a23e; --warn-soft:#382a11; --danger:#ef6b5e;
  --stand:#34d399; --accent-text:#34d399; --gold:#f3cf4a;
  --c-pri:#ef6b5e; --c-reg:#3fd0c4; --c-light:#6aa5ff; --c-elong:#e2a23e; --c-sq:#ef6b5e; --c-stand:#34d399;
  --shadow:none;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-block:12px 150px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:120px;font-size:12px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.brand{font-family:var(--f-num);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brandsub{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-left:2px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on b{background:var(--accent)}
.sync.err b{background:var(--warn)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
.chipday{flex:0 0 auto;width:44px;height:52px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.chipday .n{font-family:var(--f-num);font-weight:700;font-size:19px;line-height:1}
.chipday .t{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chipday.rest{background:var(--surface2)}
.chipday.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chipday.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chipday.sel .t{color:var(--accent-ink);opacity:.85}
.chipday.live::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-block:6px 12px}
.dayhead .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dayhead h1{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.1;margin-top:2px}
.dayhead .sub{font-size:13px;color:var(--muted);margin-top:2px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.iconbtn:active{background:var(--surface2)}
.iconbtn svg{width:18px;height:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:12px;font-weight:700;font-size:16px;letter-spacing:.02em}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px;width:auto}
.btn.danger{color:var(--danger);background:var(--surface);border:1px solid var(--line)}
.link{color:var(--accent);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.rowline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.note{font-size:13px;color:var(--muted);text-align:center;padding:4px 0}
.needs{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--warn);padding:2px 2px 8px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.row{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 4px;touch-action:pan-y;transition:transform .15s}
.row.dragging{transition:none;z-index:5;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.18);border-color:var(--accent)}
body.dragging-now{-webkit-user-select:none;user-select:none}
.row .handle{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:30px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;flex:0 0 auto}
.row .handle svg{width:14px;height:18px}
.row .body{flex:1;min-width:0;text-align:left}
.row .name{font-weight:600;font-size:15px;line-height:1.25}
.row .meta{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta .num{font-size:14px;color:var(--ink)}
.row .prog{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--muted);flex:0 0 auto;padding-right:4px}
.row .prog.full{color:var(--accent)}
.row.off .name{color:var(--muted)}
.dot-warn{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.addrow{margin-top:8px;display:flex;justify-content:center;gap:6px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.restcard{text-align:center;padding:26px 16px}
.restcard .big{font-family:var(--f-num);font-weight:700;font-size:30px}
/* logger */
.lbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:2px 10px}
.clock{font-family:var(--f-num);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.clock.paused{color:var(--warn);border-color:var(--warn)}
.clock.idle{color:var(--muted);font-size:16px}
.dots{display:flex;gap:4px;margin-block:4px 10px}
.dots button{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots button.done{background:var(--accent);opacity:.5}
.dots button.cur{background:var(--accent)}
.dots button.skip{background:var(--warn);opacity:.45}
.setrow.skip .sn,.setrow.skip input,.setrow.skip select{opacity:.4;text-decoration:line-through}
.setrow.skip .check{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.setrow.skip .check svg{opacity:1}
.skipcard{margin-top:14px;text-align:center;padding:22px 14px}
.row .prog.skip{color:var(--warn);font-size:14px}
.row.skipped .name{color:var(--muted);text-decoration:line-through}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exhead h2{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.1}
.exmeta{font-size:14px;color:var(--muted);margin-top:4px}
.exmeta .num{color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chip.pri{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.exbtns{display:flex;gap:6px;margin-top:12px}
.sets{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sethead,.setrow{display:grid;grid-template-columns:30px minmax(52px,1fr) 70px 64px 52px 40px;gap:6px;align-items:center;padding:6px 8px}
.sets.uni .sethead,.sets.uni .setrow{grid-template-columns:26px minmax(44px,1fr) 62px 46px 46px 48px 38px}
.sethead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.setrow{border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sn{font-family:var(--f-num);font-weight:700;font-size:18px;text-align:center}
.setrow .pv{font-family:var(--f-num);font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow input,.setrow select{font-family:var(--f-num);font-size:19px;font-weight:600;text-align:center;padding:8px 2px;border-radius:8px;min-width:0}
.setrow select{padding:8px 0;font-size:16px;-webkit-appearance:none;appearance:none;text-align-last:center}
.setrow.cur{background:var(--accent-soft)}
.setrow.done input,.setrow.done select{background:transparent;border-color:transparent}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;justify-self:center}
.check svg{width:16px;height:16px;opacity:0}
.setrow.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setrow.done .check svg{opacity:1}
.setops{display:flex;justify-content:space-between;padding:8px 4px 0}
.setops button{font-size:14px;color:var(--accent);font-weight:600;padding:6px 4px}
.incbox{margin-top:12px;border-radius:12px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.incbox.hot{border-color:var(--accent);background:var(--accent-soft)}
.incbox .rowline input{width:90px;font-family:var(--f-num);font-size:18px;text-align:center}
.actbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.actbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.actbar .nav{width:56px;flex:0 0 auto;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:700}
.actbar .nav:disabled{opacity:.35}
.actbar .btn{flex:1}
#restbar{position:fixed;left:0;right:0;z-index:21;padding-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#restbar.ontabs{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
#restbar .in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#restbar .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
#restbar .t{font-family:var(--f-num);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
#restbar .grow{flex:1;min-width:0}
#restbar .bar{height:4px;border-radius:2px;background:rgba(127,127,127,.35);margin-top:5px;overflow:hidden}
#restbar .bar i{display:block;height:100%;background:var(--accent)}
#restbar button{background:rgba(127,127,127,.22);border-radius:10px;padding:9px 10px;font-weight:700;font-size:14px;color:inherit}
#restbar.over .in{background:var(--accent);color:var(--accent-ink)}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:15}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--accent)}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(5,12,8,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.6;margin:4px auto 10px;position:relative}
#sheet .grab::after{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
#sheet .in{max-width:560px;margin:0 auto}
#sheet h3{font-family:var(--f-num);font-size:22px;font-weight:700}
.shsub{font-size:13px;color:var(--muted);margin-top:2px}
.menu{display:flex;flex-direction:column;margin-top:10px}
.menu button{text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500}
.menu button:last-child{border-bottom:0}
.menu button.del{color:var(--danger)}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.pick{display:flex;flex-direction:column}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.pick .pn{font-weight:600}
.pick .pm{font-size:12px;color:var(--muted);margin-top:1px}
.pick .tag{font-size:11px;color:var(--warn);white-space:nowrap}
.pick .tag.ok{color:var(--accent)}
.filt{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.filt button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700}
.stepper .v{font-family:var(--f-num);font-size:24px;font-weight:700;min-width:30px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* history & lists */
.h2{font-family:var(--f-num);font-weight:700;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:24px;line-height:1}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.hist{display:flex;flex-direction:column;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.hcard .hh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;width:100%;text-align:left}
.hcard .hd{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hcard .ht{font-weight:600;margin-top:2px}
.hcard .hx{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hcard .hx .num{font-size:15px}
.hcard .hops{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gear{display:flex;flex-direction:column}
.gear label{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:500}
.gear input{width:22px;height:22px;accent-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:90%}
.bwchip{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.bwchip.empty{color:var(--accent);font-family:var(--f-body);font-size:13px;font-weight:600}
.topr{display:flex;align-items:center;gap:10px}
@media (max-width:420px){.brandsub{display:none}}
.loadline{font-size:13px;color:var(--muted);padding:8px 4px 0}
.loadline b{color:var(--ink);font-family:var(--f-num);font-size:15px}
.setrow select.bandsel{font-family:var(--f-body);font-size:13px;font-weight:600;padding:9px 0}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent);opacity:.12}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-lbl{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.ch-dot{fill:var(--accent)}
.bwcard{display:block;width:100%;text-align:left;margin-bottom:10px}
.bwcard .top1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bwcard .v{font-family:var(--f-num);font-weight:700;font-size:26px}
.bwlist{display:flex;flex-direction:column}
.bwlist div{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.bwlist button{color:var(--muted);font-size:13px;padding:4px 6px}
.bands{display:flex;flex-direction:column;gap:8px}
.bandrow,.bandhead{display:grid;grid-template-columns:16px 1fr 58px 58px 50px 30px;gap:6px;align-items:center}
.bandhead{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.bandrow .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.bandrow input{padding:7px 6px;text-align:center}
.bandrow input.bn{text-align:left}
.bandrow .md{font-family:var(--f-num);font-weight:700;font-size:16px;text-align:center}
.bandrow button{color:var(--muted);font-size:18px}
.ssgroup{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--accent);padding-left:8px;margin-left:2px;position:relative}
.sslbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:-2px}
.row.ph{border-style:dashed;background:transparent}
.row.ph .name{color:var(--accent)}
.ssbar{margin-top:2px;margin-bottom:10px}
.ssbar .in{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.ssbar button{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:13px;font-weight:600;line-height:1.25;min-width:0}
.ssbar button span{display:block;font-family:var(--f-num);font-size:14px;color:var(--muted);font-weight:600}
.ssbar button.on{border-color:var(--accent);background:var(--accent-soft)}

function mergeSheet(){
  const old=S.days||[]; const fresh=seedDays();
  fresh.forEach((nd,i)=>{
    const od=old[i]; if(!od || !Array.isArray(od.items)) return;
    const prev=(PREV_SEED[i]&&PREV_SEED[i][1])||[]; const prevName=PREV_SEED[i]&&PREV_SEED[i][0];
    // keep a day name only if you typed it yourself (names made from muscle groups come from the sheet)
    const autoName = n => String(n||'').split(' · ').every(x=>['Lats','Biceps','Traps','Legs','Glutes','Abs','Pecs','Triceps','Delts','Rest','Cardio'].includes(x));
    if(od.name && od.name!==prevName && !autoName(od.name)){ nd.name=od.name; nd.sub=od.sub }
    nd.tmp=od.tmp||{}; nd.tmpAdd=od.tmpAdd||[];
    nd.items.forEach(ni=>{ const oi=od.items.find(x=>x.ex===ni.ex); if(!oi) return;
      ni.uid=oi.uid; ['wu','sub','ss','rest','st','pct','drops','dropPct','eccPct','eccSec'].forEach(k=>{ if(oi[k]!=null) ni[k]=oi[k] }) });
    // new cable/machine exercises start on their 1:1 stand-in, like the rest of your plan
    nd.items.forEach(ni=>{ if(!od.items.some(x=>x.ex===ni.ex) && !ni.sub){ const a=alt1(ni.ex); if(a) ni.sub=a } });
    const fromSheet = x => /^d\d+_/.test(String(x.uid||''));
    const added = od.items.filter(x=>!x.ph && !fromSheet(x) && !nd.items.some(n=>n.ex===x.ex));
    const keptOld = od.items.filter(x=>prev.includes(x.ex)).map(x=>x.ex);
    const matched = nd.items.filter(ni=>od.items.some(x=>x.ex===ni.ex)).length;
    const reordered = false;   // the Daily Schedule sheet sets the order
    const insertAfterPrev=(list,item,seq)=>{ const k=seq.indexOf(item); for(let j=k-1;j>=0;j--){ const at=list.indexOf(seq[j]); if(at>=0){ list.splice(at+1,0,item); return } } list.unshift(item) };
    let res;
    if(!reordered){ res=nd.items.slice(); const seq=od.items; added.forEach(x=>insertAfterPrev(res,x,seq.map(o=>res.find(r=>r.uid===o.uid)||o))) }
    else { res=[]; od.items.forEach(oi=>{ const m=nd.items.find(n=>n.ex===oi.ex); if(m) res.push(m); else if(added.includes(oi)) res.push(oi) });
      nd.items.filter(n=>!res.includes(n)).forEach(n=>insertAfterPrev(res,n,nd.items)) }
    nd.items=normalizeSS(res);
  });
  S.days=fresh; S.fixKickBand=S.fixD10calf=S.fixD11cg=S.fixLatX=true;
}

function unwrap(r){

    h=`<h3>Edit ${esc(ex.name)}</h3><div class="shsub">Applies everywhere this exercise is used. Sets and reps are set per day: tap the exercise in a day and choose Edit.</div>${exFields(ex,s)}

  }
  else if(s.type==='standMenu'){ const d=S.days[s.day]; const it=d.items.find(x=>x.uid===s.uid); if(!it||!it.sub){closeSheet();return}
    h=`<h3>${esc(lib(it.sub).name)}</h3><div class="shsub">Stand-in for ${esc(lib(it.ex).name)} on Day ${s.day+1}.</div>
     <div class="menu"><button data-act="standEdit">Edit exercise (name, equipment, sets, reps, style)</button><button data-act="standChange">Choose a different stand-in</button><button data-act="goalBack">Stop using it · do ${esc(lib(it.ex).name)}</button><button data-act="standPromote">Make it the main exercise (drop ${esc(lib(it.ex).name)})</button><button data-act="exInfo" data-ex="${it.sub}">History</button></div>`;
  }
  else if(s.type==='rowMenu'){ const it=findIt(); if(!it){closeSheet();return} const ex=lib(exOfS(it)); const ms=missing(ex);
    h=`<h3>${esc(ex.name)}</h3><div class="shsub">${targetText(it)} · rest ${fmtRest(it.rest)} · ${it.focus?esc(it.focus):ex.m.map(m=>MUS[m]).join(', ')}</div>
     ${ms.length?`<div class="needs" style="padding-top:8px"><span>Needs ${ms.map(r=>GEARNAME[r]).join(', ')}</span></div>`:''}
     <div class="menu">${s.ctx==='A'?`<button data-act="jumpUid" data-uid="${it.uid}">Go to this exercise</button><button data-act="skipUid" data-uid="${it.uid}">${it.skipped?'Unskip this exercise':'Skip this exercise today'}</button>`:''}<button data-act="swap" data-mode="swap" data-uid="${it.uid}">${s.ctx==='A'?'Swap · today only':s.ctx==='P'?'Swap · replace for good':'Swap'}</button>${(s.ctx==='P'||s.ctx==='A')&&!it.ph?`<button data-act="swap" data-mode="stand" data-uid="${it.uid}">${s.ctx==='P'&&it.sub?`Change stand-in (${esc(lib(it.sub).name)})`:'Stand-in · until I switch back'}</button>`:''}<button data-act="editItem" data-uid="${it.uid}">Edit exercise (sets, reps, angle, style)</button>${(()=>{ const l=ctxList(s.ctx,s.day), i=l.indexOf(it); return it.ss ? `<button data-act="ssSplit">Split superset</button>` : (l[i+1] && !l[i+1].ss && !l[i+1].ph ? `<button data-act="ssJoin">Superset with next: ${esc(lib(l[i+1].ex).name)}</button>` : '') })()}<button data-act="exInfo" data-ex="${ex.id}">History</button><button class="del" data-act="rmItem" data-uid="${it.uid}">Remove from ${scopeName(s)}</button>${s.ctx==='A'&&it.pu?`<button class="del" data-act="rmItemKeep">Remove from Day ${s.day+1} for good</button>`:''}</div>`;
  }
  else if(s.type==='edit'){ const it=findIt(); if(!it){closeSheet();return} const ex=lib(exOfS(it)); const m=s.m||mode(it);
    h=`<h3>${esc(ex.name)}</h3><div class="shsub">${s.ctx==='A'?'':s.ctx==='T'?'For your next workout only.':'Saved to Day '+(s.day+1)+' for future workouts.'}</div>${s.ctx==='A'&&it.pu?keepBox(s):''}
     ${s.useSub?`<div class="small muted" style="margin-top:6px">Stand-in for ${esc(lib(it.ex).name)}. Sets, reps and set style are shared with it.</div>`:''}${exFields(ex,s)}
     ${(()=>{ return ''; const ex2=lib(it.ex); const arms = (ex2.cat==='db' && !LEG_2DB.has(ex2.id)) ? `<div class="sec">How you do it</div><div class="seg"><button data-act="setArm" data-ex="${ex2.id}" data-k="one" class="${ex2.u?'on':''}">One arm at a time</button><button data-act="setArm" data-ex="${ex2.id}" data-k="both" class="${!ex2.u?'on':''}">Both arms</button></div>` : '';
        return arms + (ex2.tpl ? `<div class="sec">Bench angle</div><div class="seg" style="flex-wrap:wrap">${BENCH.map(d=>`<button data-act="setDeg" data-ex="${ex2.id}" data-d="${d}" class="${degOf(ex2.id)===d?'on':''}">${d}°</button>`).join('')}</div>` : '') })()}
     <div class="sec">Sets</div><div class="stepper"><button data-act="edSets" data-d="-1">−</button><span class="v" id="edSetsV">${s.sets}</span><button data-act="edSets" data-d="1">+</button></div>
     <div class="sec">Target</div><div class="seg">${[['reps','Reps'],['time','Timed'],['fail','To failure']].map(([k,l])=>`<button data-act="edMode" data-k="${k}" class="${m===k?'on':''}">${l}</button>`).join('')}</div>
     ${m!=='fail'?`<div class="grid2" style="margin-top:10px"><label class="f">From${m==='time'?' (sec)':''}<input id="edLo" inputmode="numeric" value="${s.lo??''}"></label><label class="f">To${m==='time'?' (sec)':''}<input id="edHi" inputmode="numeric" value="${s.hi??''}"></label></div>`:''}
     ${s.ctx==='P'?`<div class="sec">Warm-up sets</div><div class="stepper"><button data-act="edWu" data-d="-1">−</button><span class="v">${s.wu||0}</span><button data-act="edWu" data-d="1">+</button><span class="small muted" style="margin-left:6px">${s.wu?'Added before your working sets':'None'}</span></div>`:''}
     ${styleEditor(s,it)}
     <div class="sec">Rest between sets (seconds)</div><input id="edRest" inputmode="numeric" value="${it.rest}">
     <div class="stack" style="margin-top:16px"><button class="btn primary" data-act="edSave">Save</button></div>`;
  }
  else if(s.type==='swap'){ const it0=findIt(); if(!it0){closeSheet();return} const it = s.tmp ? effItem(S.days[s.day],it0) : it0; if(!it.ex){ closeSheet(); return } const ex=lib(it.ex);
    const alts=alternatives(it.ex); const q=(s.q||'').toLowerCase(); const f=alts.filter(c=>!q||c.name.toLowerCase().includes(q));
    const rec=f.filter(avail), oth=f.filter(c=>!avail(c));
    const hasDone = s.ctx==='A' && it.rows && it.rows.some(r=>r.done);
    const stand = s.mode==='stand';
    const why = stand ? `Used every Day ${s.day+1} workout until you switch back. ${esc(lib(it0.ex||it.ex).name)} stays in your list as the skipped goal.`

    h=`<h3>${stand?'Stand-in for':'Swap'} ${esc(ex.name)}</h3><div class="shsub">Same target: ${ex.m.map(m=>MUS[m]).join(', ')}. ${why}${hasDone?' Logged sets stay with the original; the new exercise is added after it.':''}</div>
     ${(()=>{ s.forEx=ex.id; const a=alt1(ex.id);
        if(s.set1) return `<div class="needs" style="padding-top:10px"><span>Tap an exercise to make it your 1:1 for ${esc(ex.name)}</span><button class="link" data-act="set1Toggle">Cancel</button></div>`;
        return a ? `<div class="sec">Your 1:1 alternative</div>${exListHTML([lib(a)],'doSwap')}<div class="small" style="margin-top:4px"><button class="link" data-act="set1Toggle">Change 1:1</button></div>`
                 : `<div class="small" style="margin-top:8px"><button class="link" data-act="set1Toggle">Set a 1:1 alternative</button></div>` })()}
     <input id="swapQ" data-bind="swapQ" placeholder="Search alternatives" value="${esc(s.q||'')}" style="margin-top:10px" autocomplete="off">
     <div class="sec">Recommended alternatives</div>${rec.length?exListHTML(rec,'doSwap'):'<div class="small muted">None with your current equipment.</div>'}
     <div class="sec">Other alternatives</div>${oth.length?exListHTML(oth,'doSwap'):'<div class="small muted">None.</div>'}
     <div class="note" style="margin-top:12px"><button class="link" data-act="add" data-replace="${it.uid}">Pick any exercise instead</button></div>`;
  }
  else if(s.type==='add'){ const list=libFiltered(s.q,s.cat||'all',s.mus||'all');
    const sug=(s.sugs||[]).map(id=>lib(id)).filter(e=>e&&e.name);
    h=`<h3>${s.ph?'Pick: '+esc(s.ph):s.replace?'Replace with any exercise':'Add exercise'}</h3><div class="shsub">${s.ctx==='T'?'For your next workout only.':s.ctx==='M'?'Adds to this entry.':(s.tmp||s.ctx==='A')?'':s.replace?'Saved to Day '+(s.day+1)+' for future workouts.':'Adds to Day '+(s.day+1)+' for future workouts.'}</div>${(s.tmp||s.ctx==='A')?keepBox(s):''}
     <button class="addrow" data-act="customNew" style="margin-top:10px">+ Create your own exercise</button>
     <div class="stack" style="margin-top:10px"><input id="addQ" data-bind="addQ" placeholder="Search" value="${esc(s.q||'')}" autocomplete="off">${filterBar('add',s.cat||'all',s.mus||'all')}</div>${sug.length&&!s.q?`<div class="sec">Suggested</div>${exListHTML(sug,'doAdd')}<div class="sec">All matching</div>`:''}${exListHTML(list,'doAdd')}`;
  }
  else if(s.type==='missing'){
    const rows=[]; (s.all?S.days.map((d,i)=>i):[s.day]).forEach(di=>{ const dd=S.days[di]; const list = (A&&A.dayIdx===di&&!s.all)?A.items:dd.items; list.forEach(it0=>{ const it = (s.all||ui.editDay===di||(A&&A.dayIdx===di)) ? it0 : effItem(dd,it0); if(!it.ph && !avail(lib(it.ex))) rows.push({di,it}) }) });
    h=`<h3>Needs other equipment</h3><div class="shsub">Tap one to see alternatives that hit the same muscles.</div><div class="pick" style="margin-top:8px">${rows.map(({di,it})=>{const ex=lib(it.ex);return `<button data-act="swapFrom" data-day="${di}" data-uid="${it.uid}"><div><div class="pn">${esc(ex.name)}</div><div class="pm">Day ${di+1} · needs ${missing(ex).map(r=>GEARNAME[r].split(' (')[0].toLowerCase()).join(', ')}</div></div><span class="tag ok">Swap ›</span></button>`}).join('')||'<div class="empty">All set.</div>'}</div>`;
  }
  else if(s.type==='rename'){ const d=S.days[s.day];
    h=`<h3>Rename Day ${s.day+1}</h3><div class="stack" style="margin-top:12px"><label class="f">Name<input id="rnName" value="${esc(d.name)}"></label><label class="f">Note (optional)<input id="rnSub" value="${esc(d.sub||'')}"></label><button class="btn primary" data-act="rnSave">Save name</button><button class="btn ghost" data-act="rnReset">Restore original name</button></div>`;
  }
  else if(s.type==='finish'){ const n=countSaved(); const left=A.items.filter(it=>!it.skipped).reduce((k,it)=>k+it.rows.filter(r=>!r.done).length,0);
    h=`<h3>Finish workout?</h3><div class="shsub">${n} sets logged${left?` · ${left} not logged (they won't be saved)`:''} · ${fmtDur(clockSecs())}</div><div class="stack" style="margin-top:14px">${n?`<button class="btn primary" data-act="finishYes">Finish & save</button>`:`<button class="btn primary" data-act="endSkip">End & skip Day ${A.dayIdx+1}</button><div class="small muted" style="text-align:center">Nothing logged. Moves on to Day ${(A.dayIdx+1)%S.days.length+1}.</div>`}<button class="btn ghost" data-act="closeSheet">Keep going</button><button class="btn danger" data-act="discardAsk">${s.arm?'Tap again to discard':'Discard workout'}</button></div>`;
  }
  else if(s.type==='clock'){ const c=A.clock;
    h=`<h3>Workout clock</h3><div class="shsub num" style="font-size:18px">${fmtDur(clockSecs())}${c.paused?' · paused':''}</div><div class="stack" style="margin-top:14px">
      ${!c.started?`<button class="btn primary" data-act="clockStart">Start clock now</button>`:c.paused?`<button class="btn primary" data-act="clockResume">Resume workout</button>`:`<button class="btn primary" data-act="clockPause">Pause workout</button>`}
      ${c.started?`<button class="btn ghost" data-act="clockRestart">Restart clock from 0:00</button>`:''}</div>`;
  }
  else if(s.type==='exInfo'){ const ex=lib(s.ex);
    const hist=liveSessions().filter(x=>x.type==='lift').map(x=>({x,e:x.exercises.find(e=>e.ex===s.ex)})).filter(o=>o.e).slice(0,8);
    const best = hist.reduce((b,o)=>Math.max(b,...o.e.sets.map(z=>z.w||0)),0);
    const arms = (ex.cat==='db' && !LEG_2DB.has(ex.id)) ? `<div class="sec">How you do it</div><div class="seg"><button data-act="setArm" data-ex="${ex.id}" data-k="one" class="${ex.u?'on':''}">One arm at a time</button><button data-act="setArm" data-ex="${ex.id}" data-k="both" class="${!ex.u?'on':''}">Both arms</button></div>` : '';
    const angle = arms + (ex.tpl ? `<div class="sec">Bench angle</div><div class="seg" style="flex-wrap:wrap">${BENCH.map(d=>`<button data-act="setDeg" data-ex="${ex.id}" data-d="${d}" class="${degOf(ex.id)===d?'on':''}">${d}°</button>`).join('')}</div>` : '');
    const renamed = (S.names && S.names[ex.id]) || false;
    const nameBlock = s.renaming
      ? `<div class="stack" style="margin-top:6px"><input id="exNameIn" value="${esc(ex.name)}" aria-label="Exercise name"><div class="rowline"><button class="btn sm primary" data-act="exNameSave" data-ex="${ex.id}">Save name</button>${renamed?`<button class="btn sm ghost" data-act="exNameReset" data-ex="${ex.id}">Restore original</button>`:''}<button class="btn sm ghost" data-act="exNameCancel">Cancel</button></div>${ex.tpl?'<div class="small muted">Keep the angle (like 35°) in the name and it will still follow the Bench angle buttons.</div>':''}</div>`
      : `<div class="rowline" style="justify-content:space-between;flex-wrap:nowrap"><h3>${esc(ex.name)}</h3><button class="btn sm ghost" data-act="exEdit" data-ex="${ex.id}">Edit</button></div>${renamed&&ex.base?`<div class="small muted">Originally: ${esc(ex.base.replace('{°}',degOf(ex.id)+'°'))}</div>`:''}`;
    h=`${nameBlock}<div class="shsub">${CATS[ex.cat]}${ex.u?' · one side at a time':''}${ex.req.length?' · uses '+ex.req.map(r=>GEARNAME[r].split(' (')[0].toLowerCase()).join(', '):''}</div>
     <div class="chips">${ex.m.map((m,i)=>`<span class="chip ${i===0?'pri':''}">${MUS[m]||m}</span>`).join('')}</div>
     ${missing(ex).length?`<div class="needs" style="padding-top:10px"><span>You don't have: ${missing(ex).map(r=>GEARNAME[r]).join(', ')}</span></div>`:''}
     ${exProgress(ex,s)}
     <div class="sec">Recent sessions</div>${hist.length?`<div class="hx stack">${hist.map(o=>`<div><div class="small muted">${fmtDate(o.x.end)} · <button class="link small" data-act="manEdit" data-id="${o.x.id}">Edit</button></div><div class="num">${o.e.sets.map(z=>fmtSetFull(z,ex)).join('  ·  ')}</div></div>`).join('')}</div>`:'<div class="small muted">Not logged yet.</div>'}
     ${ui.mode!=='log'?`<div class="sec">Add to a day</div><div class="rowline"><select id="toDay" style="flex:1">${S.days.map((d,i)=>`<option value="${i}">Day ${i+1} · ${esc(d.name)}</option>`).join('')}</select><button class="btn sm primary" data-act="addToDay" data-ex="${ex.id}">Add</button></div>`:''}
     ${S.custom[ex.id]?`<div style="margin-top:14px"><button class="btn danger" data-act="customDel" data-ex="${ex.id}">Delete this custom exercise</button></div>`:''}`;
  }
  else if(s.type==='custom'){ const c=s.cu=s.cu||{name:'', equip:'db', bw:'bw', extras:[], deg:null, arms:'both', m1:'pecs', m2:'', comp:false, tgt:'reps'};
    const seg=(f,opts)=>`<div class="seg" style="flex-wrap:wrap">${opts.map(([k,l])=>`<button data-act="cuSet" data-f="${f}" data-v="${k}" class="${String(c[f])===String(k)?'on':''}">${l}</button>`).join('')}</div>`;
    const musOpts=(sel,none)=>(none?`<option value="">—</option>`:'')+Object.entries(MUS).map(([k,l])=>`<option value="${k}" ${sel===k?'selected':''}>${l}</option>`).join('');
    h=`<h3>New exercise</h3><div class="shsub">Set it up like any other exercise. You can change all of this later with Edit.</div>
     <div class="sec">Name</div><input id="cuName" data-cu="name" value="${esc(c.name)}" placeholder="e.g. Landmine press" autocomplete="off">
     <div class="sec">Equipment</div>${seg('equip',EQUIP)}
     ${c.equip==='cal'?`<div class="sec">Body weight</div>${seg('bw',[['bw','Just body weight'],['add','+ Added weight'],['assist','− Band assistance']])}`:''}
     <div class="sec">Also uses</div><div class="pills">${EXTRA_GEAR.map(([k,l])=>`<button data-act="cuGear" data-k="${k}" class="${c.extras.includes(k)?'on':''}">${l}</button>`).join('')}</div>
     ${c.extras.includes('bench')?`<div class="sec">Bench angle</div>${seg('deg',[['','No angle'],...BENCH.map(d=>[d,d+'°'])])}<div class="small muted" style="margin-top:4px">${c.deg!==null&&c.deg!==''?'The angle is added to the name and follows the Bench angle setting.':'Pick an angle for incline/decline work.'}</div>`:''}
     <div class="sec">Arms / legs</div>${seg('arms',[['one','1 at a time (log left & right)'],['both','Both together']])}
     <div class="sec">Muscles</div><div class="grid2"><label class="f">Main<select data-cu="m1">${musOpts(c.m1)}</select></label><label class="f">Also works<select data-cu="m2">${musOpts(c.m2,true)}</select></label></div>
     <div class="sec">Movement</div>${seg('comp',[['true','Compound'],['false','Isolation']])}
     <div class="sec">Target</div>${seg('tgt',[['reps','Reps'],['time','Timed'],['fail','To failure']])}
     <div class="stack" style="margin-top:16px"><button class="btn primary" data-act="customSave">Save exercise</button></div>`;
  }
  else if(s.type==='bw'){ const l=bwSorted(); const st=bwStats(); const td=new Date(); const ds=`${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`;
    h=`<h3>Body weight</h3><div class="shsub">Counted in pull-ups, dips and other body-weight exercises.</div>
     <div class="rowline" style="margin-top:12px;flex-wrap:nowrap"><input id="bwIn" inputmode="decimal" placeholder="${st?st.L.w:'Weight'}" style="flex:1;font-family:var(--f-num);font-size:20px;text-align:center" aria-label="Body weight"><span class="muted">${S.unit}</span><input id="bwDate" type="date" value="${ds}" style="width:auto;flex:1" aria-label="Date"></div>
     <div style="margin-top:10px"><button class="btn primary" data-act="bwLog">Log weight</button></div>
     ${(()=>{ const rg=s.range||'m3'; const L=l.filter(e=>inRange(e.t,rg)); if(!l.length) return ''; const ws=L.map(e=>e.w);
        return `<div class="tiles">${tile('list','b',L.length,'entries')}${tile('down','gr',ws.length?Math.min(...ws):'–','min',S.unit)}${tile('up','o',ws.length?Math.max(...ws):'–','max',S.unit)}</div>
        <div class="chartbox"><div class="ctl"><span class="small muted">${st?`7-day avg ${st.avg7??'–'} · ${st.ch>0?'+':''}${st.ch} ${S.unit} in 30 days`:''}</span>${rangePills('bwRange',rg)}</div>${bwChart(L,150)}</div>` })()}
     ${l.length?`<div class="sec">Recent</div><div class="bwlist">${[...l].reverse().slice(0,12).map(e=>`<div><span>${fmtDate(e.t)}</span><span class="num" style="font-size:17px;font-weight:700">${e.w} ${S.unit}</span><button data-act="bwDel" data-t="${e.t}">Remove</button></div>`).join('')}</div>`:''}`;
  }
  else if(s.type==='done'){ const x=liveSessions().find(z=>z.id===s.id); if(!x){ closeSheet(); return }
    const sets=x.exercises.reduce((n,e)=>n+e.sets.length,0); const vol=x.exercises.reduce((n,e)=>{ const ex=lib(e.ex), k=dbCount(ex)===2?2:1; return n+e.sets.reduce((m,z)=>m+(loadMode(ex)==='wt'?(num(z.w)||0)*k*(repOf(z,ex)||0):0),0) },0);
    const prs=x.prs||[]; const sp=Array.from({length:10},(_,i)=>{ const a=i/10*Math.PI*2; return `<i style="--x:${Math.round(Math.cos(a)*54)}px;--y:${Math.round(Math.sin(a)*54)}px"></i>` }).join('');
    h=`<div class="done"><div class="burst">${prs.length?sp:''}<div class="core">${prs.length?ICO.star:ICO.check}</div></div>
      <h3>${prs.length?`${prs.length} new record${prs.length>1?'s':''}!`:'Workout complete'}</h3><div class="shsub">${esc(x.dayName)} · Day ${x.dayIdx+1}</div>
      <div class="tiles">${tile('clock','b',fmtDur(x.dur||0),'time')}${tile('list','gr',sets,'sets')}${tile('stack','o',vol>=10000?Math.round(vol/100)/10+'k':Math.round(vol).toLocaleString(),'volume',S.unit)}</div>
      ${prs.length?`<div class="sec" style="text-align:left">Personal records</div><div class="prlist">${prs.map(p=>`<div class="pr"><span class="st">${ICO.star}</span><div class="t"><b>${esc(lib(p.ex).name)}</b><span>${p.kind}${p.det?' · '+esc(p.det):''}</span></div><span class="val">${esc(p.val)}</span></div>`).join('')}</div>`:''}
      <div class="exsum">${x.exercises.map(e=>{ const ex=lib(e.ex); return `<div><span>${esc(ex.name)}</span><span class="num muted">${e.sets.map(z=>fmtSet(z,ex)).join(', ')}</span></div>` }).join('')}</div>
      <div class="stack" style="margin-top:16px"><button class="btn primary" data-act="closeSheet">Done</button></div></div>`;
  }
  else if(s.type==='restore'){
    h=`<h3>Restore from backup</h3><div class="shsub">Paste a backup copied from this app. Workouts are merged; the plan and equipment are replaced.</div><textarea id="restoreTxt" style="margin-top:10px" placeholder="Paste backup here"></textarea><div class="stack" style="margin-top:10px"><button class="btn primary" data-act="restoreDo">Restore</button></div>`;
  }
  else if(s.type==='resetPlan'){
    h=`<h3>Reset the 16-day plan?</h3><div class="shsub">Puts back your original list, names, sets and reps. Workout history is kept.</div><div class="stack" style="margin-top:14px"><button class="btn danger" data-act="resetPlanDo">Reset plan</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div>`;
  }
  sh.innerHTML=`<div class="grab"></div><div class="in">${h}</div>`;
}

/* ---------- actions ---------- */
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200) }
function saveCtx(ctx){ ctx==='M' ? saveDraft() : ctx==='A' ? saveActive() : saveState() }
function scopeName(s){ return s.ctx==='A'?'this workout':s.ctx==='T'?'your next workout':'Day '+(s.day+1) }

function doReplace(exId){

  const it=list[i];

  if(s.ctx==='T'){ it.ex=exId; if(lib(exId).f){ it.lo=null; it.hi=null } else if(it.lo==null){ it.lo=10; it.hi=14 } saveState(); closeSheet(); render(); toast(`${lib(exId).name} for your next workout`); return }
  if(s.ctx==='A'){
    // swapping the skipped goal itself = choose a different stand-in
    let tgt=it, ti=i; if(it.ghost){ const si=list.find(x=>x.pu===it.goalOf); if(si){ tgt=si; ti=list.indexOf(si) } }
    const pu = tgt.pu || (tgt.ghost?tgt.goalOf:null);
    const base={ex:exId, sets:workRows(tgt).length, lo:tgt.lo, hi:tgt.hi, rest:tgt.rest, ss:tgt.ss, wu:tgt.wu, pu:pu, focus:tgt.focus};
    if(lib(exId).f){ base.lo=null; base.hi=null } else if(tgt.lo==null){ base.lo=10; base.hi=14 }
    const ni=newActiveItem(base); if(tgt.par) ni.par=tgt.par;
    const hasGoal = list.some(x=>x.ghost && x.goalOf===pu);
    const pit0 = pu ? S.days[A.dayIdx].items.find(x=>x.uid===pu) : null;
    if(tgt.rows.some(r=>r.done)){ delete tgt.ss; delete tgt.pu; ni.par=tgt.uid; list.splice(ti+1,0,ni); A.cur=ti+1 }
    else if(s.mode==='swap' || hasGoal || !pu || (pit0 && pit0.ex===exId)){ list[ti]=ni; A.cur=ti }
    else { tgt.ghost=true; tgt.goalOf=pu; tgt.skipped=true; delete tgt.pu; delete tgt.ss; ni.par=tgt.uid; list.splice(ti+1,0,ni); A.cur=ti+1 }
    if(pit0 && pit0.ex===exId){ const g=list.find(x=>x.ghost && x.goalOf===pu); if(g) list.splice(list.indexOf(g),1); A.cur=Math.max(0,list.indexOf(ni)) }
    normalizeSS(list); fixLinks(list);
    if(s.keep && pit0){ if(pit0.ex===exId) delete pit0.sub; else pit0.sub=exId; if(S.days[A.dayIdx].tmp) delete S.days[A.dayIdx].tmp[pit0.uid]; saveState(); saveActive(); closeSheet(); render(); toast(pit0.ex===exId?'Back to your goal exercise':`${lib(exId).name} is your stand-in until you switch back`); return }
  } else if(s.tmp && s.keep && !it.ph){
    const d=S.days[s.day]; if(d.tmp) delete d.tmp[it.uid]; if(exId===it.ex) delete it.sub; else it.sub=exId;
    saveState(); closeSheet(); render(); toast(exId===it.ex?'Back to your goal exercise':`${lib(exId).name} is your stand-in until you switch back`); return
  } else if(s.tmp && !s.keep){
    const d=S.days[s.day]; d.tmp=d.tmp||{}; if(exId===it.ex) delete d.tmp[it.uid]; else d.tmp[it.uid]=exId;
    saveState(); closeSheet(); render(); toast(`${lib(exId).name} for your next workout`); return
  } else if(s.mode==='stand' && !it.ph){
    if(exId===it.ex) delete it.sub; else it.sub=exId; saveState(); closeSheet(); render(); toast(exId===it.ex?'Back to your goal exercise':`${lib(exId).name} is your stand-in until you switch back`); return
  } else {
    applyPlanSwap(S.days[s.day],it,exId);
  }
  saveCtx(s.ctx); closeSheet(); render(); toast(`Swapped to ${lib(exId).name}`);
}

  }
  if(el.dataset.band){ const b=S.bands.find(x=>x.id===el.dataset.band); if(!b) return; const f=el.dataset.bf; b[f]= f==='name' ? el.value : (num(el.value)??0);
    const md=document.getElementById('md_'+b.id); if(md) md.textContent=bandMed(b); if(f==='name'){ const sw=el.parentElement.querySelector('.sw'); if(sw) sw.style.background=swatch(b.name) }
    clearTimeout(setSaveT); setSaveT=setTimeout(saveState,600); return }
  if(el.dataset.gear){ S.gear[el.dataset.gear]=el.checked; saveState(); const y=window.scrollY; render(); window.scrollTo(0,y); return }
  const b=el.dataset.bind; if(!b) return;
  if(b==='libQ'){ ui.libQ=el.value; rerenderKeep(el) }
  else if(b==='libMus'){ ui.libMus=el.value; render() }
  else if(b==='addQ'){ ui.sheet.q=el.value; rerenderSheetKeep(el) }
  else if(b==='addMus'){ ui.sheet.mus=el.value; renderSheet() }
  else if(b==='swapQ'){ ui.sheet.q=el.value; rerenderSheetKeep(el) }
});
function rerenderKeep(el){ const id=el.id, p=el.selectionStart; render(); const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(p,p)}catch(e){} } }
function rerenderSheetKeep(el){ const id=el.id, p=el.selectionStart, st=$('#sheet').scrollTop; renderSheet(); const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(p,p)}catch(e){} } $('#sheet').scrollTop=st }
document.addEventListener('focusin',e=>{ if(e.target.matches('.setrow input')) setTimeout(()=>{ try{ e.target.select() }catch(x){} },0) });

/* ---------- drag & drop reorder ---------- */
let drag=null;
// Drag to reorder. iPhone uses touch events (Safari otherwise turns the gesture into a page scroll and cancels it);
// a mouse uses pointer events. The page auto-scrolls when you hold near the top or bottom edge.
function dragStart(hd,y,id){
  const row=hd.closest('.row'), list=row.closest('.list'); if(!row||!list) return;
  const rows=[...list.querySelectorAll('.row')]; const from=rows.indexOf(row);
  const rects=rows.map(r=>r.getBoundingClientRect()); const hgt=rects[from].height+6;
  drag={row,list,rows,from,to:from,startY:y,lastY:y,startScroll:window.scrollY,mids:rects.map(r=>r.top+r.height/2),hgt,id};
  row.classList.add('dragging'); document.body.classList.add('dragging-now');
  try{ navigator.vibrate && navigator.vibrate(10) }catch(x){}
  requestAnimationFrame(dragLoop);
}
function dragLayout(){
  if(!drag) return;
  const dy=(drag.lastY-drag.startY)+(window.scrollY-drag.startScroll);
  drag.row.style.transform=`translateY(${dy}px)`;
  const center=drag.mids[drag.from]+dy; let to=drag.from;
  drag.mids.forEach((m,i)=>{ if(i<drag.from && center<m) to=Math.min(to,i); if(i>drag.from && center>m) to=Math.max(to,i) });
  drag.to=to;
  drag.rows.forEach((r,i)=>{ if(i===drag.from) return; let t=0; if(drag.from<to && i>drag.from && i<=to) t=-drag.hgt; if(to<drag.from && i>=to && i<drag.from) t=drag.hgt; r.style.transform=t?`translateY(${t}px)`:'' });
}
function dragLoop(){
  if(!drag) return;
  const edge=80, bottomBar=90, H=window.innerHeight;
  let v=0; if(drag.lastY<edge) v=-Math.ceil((edge-drag.lastY)/6); else if(drag.lastY>H-bottomBar-edge) v=Math.ceil((drag.lastY-(H-bottomBar-edge))/6);
  if(v){ const before=window.scrollY; window.scrollBy(0,v); if(window.scrollY!==before) dragLayout() }
  requestAnimationFrame(dragLoop);
}
document.addEventListener('touchstart',e=>{
  const hd=e.target.closest('[data-drag]'); if(!hd || drag) return;
  e.preventDefault(); dragStart(hd, e.touches[0].clientY, 'touch');
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!drag || drag.id!=='touch') return; e.preventDefault();
  drag.lastY=e.touches[0].clientY; dragLayout();
},{passive:false});
document.addEventListener('touchend',()=>{ if(drag && drag.id==='touch') endDrag() });
document.addEventListener('touchcancel',()=>{ if(drag && drag.id==='touch') endDrag() });
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch') return;
  const hd=e.target.closest('[data-drag]'); if(!hd || drag) return; e.preventDefault();
  dragStart(hd, e.clientY, e.pointerId); try{ hd.setPointerCapture(e.pointerId) }catch(x){}
});
document.addEventListener('pointermove',e=>{
  if(!drag || e.pointerId!==drag.id) return; e.preventDefault();
  drag.lastY=e.clientY; dragLayout();
},{passive:false});
function endDrag(){
  if(!drag) return; const {list,rows}=drag; const domFrom=drag.from, domTo=drag.to; rows.forEach(r=>{r.style.transform=''; r.classList.remove('dragging')}); drag=null; document.body.classList.remove('dragging-now');
  if(domFrom===domTo) return;
  const ctx=list.dataset.ctx, day=+list.dataset.day; const arr=ctxList(ctx,day);
  // rows on screen aren't always one-per-exercise (Edit day draws stand-ins as their own rows), so go by which exercise each row belongs to
  const idxOf = r => r && r.dataset ? arr.findIndex(x=>x.uid===r.dataset.uid) : -1;
  const from=idxOf(rows[domFrom]); let to=idxOf(rows[domTo]); if(from<0 || to<0){ render(); return }
  if(to===from){ render(); return }
  if(domTo>domFrom && to<from) to=from; if(domTo<domFrom && to>from) to=from; if(to===from){ render(); return }
  const curUid = ctx==='A' ? A.items[A.cur]?.uid : null;
  // Exercises move in blocks: a goal with its stand-in(s) (a whole chain if you swapped more than once),
  // and both halves of a superset. Dropping a block next to another never splits that one either.
  const standOf = x => ctx!=='A' || !x ? null : (arr.find(y=>y.par && y.par===x.uid) || (x.ghost ? arr.find(y=>!y.ghost && !y.par && y.pu && y.pu===x.goalOf) : null));
  const goalOf_ = x => ctx!=='A' || !x ? null : (x.par ? arr.find(y=>y.uid===x.par) : (!x.ghost && x.pu ? arr.find(y=>y.ghost && y.goalOf===x.pu) : null)) || null;
  const rootOf = x => { let r=x; const seen=new Set([x]); for(;;){ const g=goalOf_(r); if(!g || seen.has(g)) return r; seen.add(g); r=g } };
  const key=new Map(); arr.forEach(x=>key.set(x, rootOf(x)));
  arr.forEach(x=>{ const p=partnerOf(arr,x); if(p){ const ka=key.get(x), kb=key.get(p); if(ka!==kb) arr.forEach(y=>{ if(key.get(y)===kb) key.set(y,ka) }) } });
  const order=[], members=new Map(); arr.forEach(x=>{ const k=key.get(x); if(!members.has(k)){ members.set(k,[]); order.push(k) } members.get(k).push(x) });
  const laidOut = k => { const mem=members.get(k), out=[]; mem.forEach(x=>{ if(out.includes(x) || rootOf(x)!==x) return; let c=x; const seen=new Set(); while(c && !seen.has(c) && mem.includes(c)){ out.push(c); seen.add(c); c=standOf(c) } }); mem.forEach(x=>{ if(!out.includes(x)) out.push(x) }); return out };
  const fk=key.get(arr[from]), tk=key.get(arr[to]);
  if(fk!==tk){ order.splice(order.indexOf(fk),1); const at=order.indexOf(tk)+(to>from?1:0); order.splice(at,0,fk) }
  const next=order.flatMap(laidOut); arr.splice(0,arr.length,...next);
  normalizeSS(arr);
  if(ctx==='A'){ A.cur=Math.max(0,A.items.findIndex(x=>x.uid===curUid)); A.orderDirty=true }
  saveCtx(ctx); render();
}
document.addEventListener('pointerup',e=>{ if(drag && drag.id===e.pointerId) endDrag() }); document.addEventListener('pointercancel',e=>{ if(drag && drag.id===e.pointerId) endDrag() });


/* ---------- swipe a sheet down to close it ---------- */
let sheetDrag=null;
document.addEventListener('touchstart',e=>{ const sh=document.getElementById('sheet'); if(!sh || !ui.sheet || e.touches.length!==1 || !sh.contains(e.target)) return;
  if(e.target.closest('input,select,textarea,[data-drag]')) return;
  sheetDrag={y0:e.touches[0].clientY, x0:e.touches[0].clientX, t0:Date.now(), dy:0, active:false, grab:!!e.target.closest('.grab'), top:sh.scrollTop<=0} },{passive:true});
document.addEventListener('touchmove',e=>{ if(!sheetDrag) return; const sh=document.getElementById('sheet'); if(!sh){ sheetDrag=null; return }
  const dy=e.touches[0].clientY-sheetDrag.y0, dx=e.touches[0].clientX-sheetDrag.x0;
  if(!sheetDrag.active){ if(dy>8 && dy>Math.abs(dx) && (sheetDrag.grab || (sheetDrag.top && sh.scrollTop<=0))) sheetDrag.active=true; else if(Math.abs(dy)>8 || Math.abs(dx)>8){ sheetDrag=null; return } else return }
  e.preventDefault(); sheetDrag.dy=Math.max(0,dy); sh.style.transition='none'; sh.style.transform=`translateY(${sheetDrag.dy}px)`;
  const bd=document.querySelector('#sheetWrap .backdrop'); if(bd) bd.style.opacity=String(Math.max(0.2,1-sheetDrag.dy/400)) },{passive:false});
function endSheetDrag(){ if(!sheetDrag) return; const d=sheetDrag; sheetDrag=null; if(!d.active) return; const sh=document.getElementById('sheet'); if(!sh) return; const bd=document.querySelector('#sheetWrap .backdrop');
  const v=d.dy/Math.max(1,Date.now()-d.t0); sh.style.transition='transform .2s ease';
  if(d.dy>110 || (v>0.6 && d.dy>40)){ sh.style.transform='translateY(100%)'; setTimeout(()=>{ sh.style.transform=''; sh.style.transition=''; if(bd) bd.style.opacity=''; closeSheet() },190) }
  else { sh.style.transform=''; if(bd) bd.style.opacity=''; setTimeout(()=>{ sh.style.transition='' },220) } }
document.addEventListener('touchend',endSheetDrag); document.addEventListener('touchcancel',endSheetDrag);
/* ---------- timers ---------- */
let lastRestKey='';
function tick(force){
  const ct=$('#clockT'); if(ct && A) ct.textContent=fmtDur(clockSecs());
  const rb=$('#restbar');
  if(!A || !A.rest){ if(!rb.hidden){ rb.hidden=true; rb.innerHTML=''; lastRestKey='' } return }
  const r=A.rest; const left = r.paused ? r.left : r.end-Date.now();
  if(left<=0 && !r.chimed){ r.chimed=true; r.doneAt=Date.now(); chime(); saveActive() }
  if(r.chimed && Date.now()-(r.doneAt||0)>6000){ A.rest=null; saveActive(); rb.hidden=true; rb.innerHTML=''; lastRestKey=''; return }
  const over=left<=0; const key=(over?'o':'r')+(r.paused?'p':'')+(ui.mode==='log'?'l':'t');
  if(force || key!==lastRestKey){
    lastRestKey=key; rb.hidden=false; rb.className = (over?'over ':'')+(ui.mode==='log'?'':'ontabs');
    rb.innerHTML=`<div class="in"><div class="grow"><div class="lbl">${over?'Rest over · go':'Rest'}${r.paused?' · paused':''}</div><div class="t" id="restT"></div><div class="bar"><i id="restP"></i></div></div><button data-act="restMinus">−15</button><button data-act="restPlus">+15</button><button data-act="restSkip">${over?'OK':'Skip'}</button></div>`;
  }
  const t=$('#restT'), p=$('#restP'); if(t) t.textContent=over?'0:00':fmtDur(Math.ceil(left/1000)); if(p) p.style.width=Math.max(0,Math.min(100,100*(1-left/(r.dur*1000))))+'%';
}
setInterval(()=>tick(false),250);

/* ---------- boot ---------- */
// migrate any missing fields
S.gear=S.gear||{}; S.custom=S.custom||{}; S.nextLoad=S.nextLoad||{}; if(!S.unit) S.unit='lb'; if(!S.bw) S.bw=[]; if(!S.bands) S.bands=seedBands();
const MIGRATED = migrate();

if(A){ if(!Array.isArray(A.items) || !A.items.length){ A=null; ui.mode='overview' } else { A.cur=Math.max(0,Math.min(A.cur|0, A.items.length-1)); A.items.forEach(x=>{ if(!Array.isArray(x.rows)) x.rows=[] }) } }

      else toast('Update downloaded. It applies the next time you open POT.');
    });
    const check = ()=>navigator.serviceWorker.getRegistration().then(r=>r && r.update()).catch(()=>{});
    setTimeout(check, 1500);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') check() });
    window.potCheckUpdate = check;
    setTimeout(async ()=>{ const v=await liveVersion(); if(!v || v===APP_VERSION) return; ui.newVersion=v;
      let tried=false; try{ tried=sessionStorage.getItem('pot.upd')===v }catch(e){}
      if(!A && !ui.sheet && ui.mode!=='manual' && !tried){ try{ sessionStorage.setItem('pot.upd',v) }catch(e){} H.forceUpdate() }
      else { toast('Version '+v+' is ready: Equipment → Update now'); render() } }, 2500);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') setTimeout(async ()=>{ const v=await liveVersion(); if(v && v!==APP_VERSION){ ui.newVersion=v; if(!A && !ui.sheet && ui.mode!=='manual') H.forceUpdate(); else render() } }, 1500) });
  } }catch(e){}

}
